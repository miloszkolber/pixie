name: CI

# Source, service-isolation and Go workspace gates.
on:
  workflow_call:
    inputs:
      revision:
        description: Source commit to validate
        required: false
        type: string

# Source validation is invoked once by the container-image workflow.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Source validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: web/go.mod
          cache-dependency-path: web/go.sum
      - name: Cache bun install
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run check:deps
        working-directory: web
      - run: bun run check:contracts
        working-directory: web
      - run: bun audit --audit-level=high
        working-directory: web
      - run: bun run lint
        working-directory: web
      - run: bun run typecheck
        working-directory: web
      # Build first: several tests inspect the embedded web bundle and the
      # full-host binary, and `go test` requires webui/dist for //go:embed.
      - run: bun run build
        working-directory: web
      - name: Run tests
        working-directory: web
        run: |
          set -uo pipefail
          # A Go temp-dir cleanup can race a background writer. Retry once;
          # real failures fail both attempts.
          for attempt in 1 2; do
            if bun run test; then exit 0; fi
            echo "test attempt ${attempt} failed"
          done
          exit 1
      - name: Validate Compose service isolation
        run: sh web/tests/deployment/compose.test.sh
      - run: gofmt -d cmd internal tests | tee /tmp/pixie-gofmt.diff && test ! -s /tmp/pixie-gofmt.diff
        working-directory: web
      - run: go test -race -count=1 ./...
        env:
          CGO_ENABLED: "1"
        working-directory: web
      - run: go vet ./...
        env:
          CGO_ENABLED: "0"
        working-directory: web
      - name: Test Go assistant module
        run: go test -count=1 ./...
        env:
          CGO_ENABLED: "0"
        working-directory: assistant
      - name: Test shared contracts module
        run: bun test tests && go test -count=1 ./...
        env:
          CGO_ENABLED: "0"
        working-directory: shared
      - name: Test administration bridge
        run: bun test assistant/bridge
  ui:
    name: Browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Build browser acceptance image
        run: docker build -f web/Dockerfile --target ui-acceptance -t pixie-ui-acceptance .
      - name: Run browser acceptance
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/ui
          chmod 0777 artifacts/ui
          # The acceptance exercises real timers and can flake once when two
          # copies run concurrently (the release workflow reuses this file).
          # Retry once; a genuine regression fails both attempts.
          for attempt in 1 2; do
            if docker run --rm \
              --network none \
              --read-only \
              --shm-size 256m \
              --tmpfs /tmp:rw,nosuid,nodev,size=256m,uid=1000,gid=1000 \
              --tmpfs /home/pixie:rw,nosuid,nodev,size=64m,uid=1000,gid=1000 \
              --mount "type=bind,source=$PWD/artifacts/ui,target=/artifacts" \
              pixie-ui-acceptance; then
              exit 0
            fi
            echo "browser acceptance attempt ${attempt} failed"
          done
          exit 1
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-acceptance
          path: artifacts/ui
          if-no-files-found: warn
          retention-days: 14
  go-workspace:
    name: Go workspace filesystem parity (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: web/go.mod
          cache-dependency-path: web/go.sum
      - name: Synthesize web embed placeholder
        run: mkdir -p webui/dist && touch webui/dist/.gitkeep
        working-directory: web
      - name: Verify native workspace filesystem behavior
        run: CGO_ENABLED=0 go test -count=1 ./tests/go/workspace
        working-directory: web
