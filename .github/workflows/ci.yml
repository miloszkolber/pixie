name: CI

# Source, service-isolation and official Pi compatibility gates.
on:
  workflow_call:
    inputs:
      revision:
        description: Source commit to validate
        required: false
        type: string

# Source validation is invoked once by the container-image workflow.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Source validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: pixie/go.mod
          cache-dependency-path: pixie/go.sum
      - name: Cache bun install
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
        working-directory: pixie
      - run: bun run check:deps
        working-directory: pixie
      - run: bun audit --audit-level=high
        working-directory: pixie
      - run: bun run lint
        working-directory: pixie
      - run: bun run typecheck
        working-directory: pixie
      - run: bun run test
        working-directory: pixie
      - run: bun run build
        working-directory: pixie
      - name: Validate Compose service isolation
        run: sh pixie/tests/deployment/compose.test.sh
      - run: gofmt -d cmd internal tests | tee /tmp/pixie-gofmt.diff && test ! -s /tmp/pixie-gofmt.diff
        working-directory: pixie
      - run: go test -race -count=1 ./...
        env:
          CGO_ENABLED: "1"
        working-directory: pixie
      - run: go vet ./...
        env:
          CGO_ENABLED: "0"
        working-directory: pixie
  ui:
    name: Browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Build browser acceptance image
        run: docker build -f pixie/Dockerfile --target ui-acceptance -t pixie-ui-acceptance .
      - name: Run browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ui
          chmod 0777 artifacts/ui
          container=""
          cleanup() {
            if [[ -n "$container" ]]; then
              docker rm -f "$container" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          container=$(docker create \
            --network none \
            --read-only \
            --shm-size 256m \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m,uid=1000,gid=1000 \
            --tmpfs /home/pixie:rw,nosuid,nodev,size=64m,uid=1000,gid=1000 \
            --mount "type=bind,source=$PWD/artifacts/ui,target=/artifacts" \
            pixie-ui-acceptance)
          status=0
          docker start -a "$container" || status=$?
          exit "$status"
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-acceptance
          path: artifacts/ui
          if-no-files-found: warn
          retention-days: 14
  pi:
    name: Official Pi compatibility (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: pixie/go.mod
          cache-dependency-path: pixie/go.sum
      - name: Verify native workspace filesystem behavior
        run: CGO_ENABLED=0 go test -count=1 ./tests/go/workspace
        working-directory: pixie
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
        working-directory: pixie
      - run: bun test tests/pi-host
        working-directory: pixie
      - name: Verify application against native Pi host
        run: go test -count=1 ./tests/go/controller -run TestApplicationThroughNativePiHost
        working-directory: pixie
