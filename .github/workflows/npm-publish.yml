name: Validate assistant package

# The Go pixie-assistant binary is part of the commit-named release set. The
# historical npm package remains buildable for existing users, but this workflow
# never publishes or derives a release identity from package tags.
on:
  pull_request:
    branches: [main]
    paths:
      - "assistant/**"
      - "package.json"
      - "bun.lock"
  schedule:
    - cron: "37 4 * * 0"
  workflow_dispatch:

concurrency:
  group: assistant-package-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Build and inspect assistant package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install exact dependencies
        run: bun install --frozen-lockfile
      - name: Build runtime-only package
        working-directory: assistant
        run: bun run build
      - name: Pack for inspection without publication
        working-directory: assistant
        run: |
          set -euo pipefail
          bun pm pack --dry-run 2>&1 | tee pack.log
          test -s dist/main.js
          test -s dist/doctor.js
          test -s pack.log
