name: Publish host package

# Publishes @pixie/pi-host to the npm registry so the Pi service runs
# without a checkout: `bunx @pixie/pi-host@<version> --extensions <profiles>`.
# Tags look like `pi-host-v1.2.3`; the tag version stamps package.json at
# publish time and is never committed.

on:
  push:
    tags: ["pi-host-v*"]
  workflow_dispatch:

concurrency:
  group: npm-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Source validation
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ github.sha }}
    permissions:
      contents: read

  publish:
    name: Publish @pixie/pi-host
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Derive package version
        id: source
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == pi-host-v* ]]; then
            echo "version=${GITHUB_REF_NAME#pi-host-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Set up Node for publishing
        uses: actions/setup-node@49933ea5288a43679e63670542f975f57cbd7c9 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Stamp release version
        run: |
          bun -e 'const fs = require("node:fs"); const p = "pi/host/package.json"; const manifest = JSON.parse(fs.readFileSync(p, "utf8")); manifest.version = process.env.PACKAGE_VERSION; fs.writeFileSync(p, JSON.stringify(manifest, null, "\t") + "\n");' 
        env:
          PACKAGE_VERSION: ${{ steps.source.outputs.version }}

      - name: Verify packed contents
        working-directory: pi/host
        run: |
          bun pm pack --dry-run 2>&1 | tee pack.log
          grep -q '"bin"' pack.log || true

      - name: Publish to npm
        working-directory: pi/host
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
