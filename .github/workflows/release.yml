name: Commit release

# Validation runs for every candidate. The publish job is additionally guarded
# by the repository variable PIXIE_RELEASE_ENABLED; adding this workflow does
# not enable publication by itself.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 4 * * 0"
  workflow_dispatch:
    inputs:
      revision:
        description: Full commit to validate (must be reachable from main)
        required: false
        type: string
  push:
    branches: [main]

concurrency:
  group: commit-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate source and package gates
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ inputs.revision || github.sha }}
    permissions:
      contents: read

  identity:
    name: Resolve source commit identity
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      source_commit: ${{ steps.source.outputs.source_commit }}
      release_id: ${{ steps.source.outputs.release_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
      - id: source
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          SOURCE_COMMIT=$(git rev-parse --verify 'HEAD^{commit}')
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'SOURCE_COMMIT must be 40 lowercase hexadecimal characters' >&2
            exit 1
          fi
          if [[ -n "$REQUESTED_REVISION" && ! "$REQUESTED_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'workflow_dispatch revision must be a full 40-character commit SHA' >&2
            exit 1
          fi
          if [[ -n "$REQUESTED_REVISION" && "$REQUESTED_REVISION" != "$SOURCE_COMMIT" ]]; then
            echo 'checked out source does not match the requested revision' >&2
            exit 1
          fi
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' ]]; then
            git fetch --no-tags origin main:refs/remotes/origin/main
            git merge-base --is-ancestor "$SOURCE_COMMIT" refs/remotes/origin/main || {
              echo 'workflow_dispatch revision must be reachable from main' >&2
              exit 1
            }
          fi
          RELEASE_ID="sha-${SOURCE_COMMIT:0:12}"
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  stage-amd64:
    name: Stage native amd64 release archives
    needs: [validate, identity]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install release build dependencies
        run: bun install --frozen-lockfile
      - name: Build and stage native immutable archives
        run: bun run build:release --architecture amd64 --output "$RUNNER_TEMP/pixie-release"
      - name: Verify native archive names and staging metadata
        working-directory: ${{ runner.temp }}/pixie-release
        run: |
          set -euo pipefail
          SOURCE_COMMIT='${{ needs.identity.outputs.source_commit }}'
          RELEASE_ID='${{ needs.identity.outputs.release_id }}'
          for archive in \
            "pixie_web-${RELEASE_ID}-linux-amd64.tar.gz" \
            "pixie-${RELEASE_ID}-linux-amd64.tar.gz"; do
            test -f "$archive"
          done
          sha256sum --check checksums-linux-amd64.txt
          jq -e --arg source '${{ needs.identity.outputs.source_commit }}' --arg release_id '${{ needs.identity.outputs.release_id }}' \
            '.schemaVersion == 2 and .releaseId == $release_id and .sourceCommit == $source and .cleanSourceTree == true and .completeSet == false and .architectures == ["amd64"] and .products == ["pixie_web", "pixie"] and .checksumsPresent == true and .sbomPresent == false and .provenancePresent == false and (.archiveHashes | length == 2) and (.artifacts | length == 2)' \
            release-manifest-linux-amd64.json >/dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pixie-release-${{ needs.identity.outputs.source_commit }}-amd64
          path: ${{ runner.temp }}/pixie-release
          if-no-files-found: error
          retention-days: 14

  stage-arm64:
    name: Stage native arm64 release archives
    needs: [validate, identity]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install release build dependencies
        run: bun install --frozen-lockfile
      - name: Build and stage native immutable archives
        run: bun run build:release --architecture arm64 --output "$RUNNER_TEMP/pixie-release"
      - name: Verify native archive names and staging metadata
        working-directory: ${{ runner.temp }}/pixie-release
        run: |
          set -euo pipefail
          RELEASE_ID='${{ needs.identity.outputs.release_id }}'
          for archive in \
            "pixie_web-${RELEASE_ID}-linux-arm64.tar.gz" \
            "pixie-${RELEASE_ID}-linux-arm64.tar.gz"; do
            test -f "$archive"
          done
          sha256sum --check checksums-linux-arm64.txt
          jq -e --arg source '${{ needs.identity.outputs.source_commit }}' --arg release_id '${{ needs.identity.outputs.release_id }}' \
            '.schemaVersion == 2 and .releaseId == $release_id and .sourceCommit == $source and .cleanSourceTree == true and .completeSet == false and .architectures == ["arm64"] and .products == ["pixie_web", "pixie"] and .checksumsPresent == true and .sbomPresent == false and .provenancePresent == false and (.archiveHashes | length == 2) and (.artifacts | length == 2)' \
            release-manifest-linux-arm64.json >/dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pixie-release-${{ needs.identity.outputs.source_commit }}-arm64
          path: ${{ runner.temp }}/pixie-release
          if-no-files-found: error
          retention-days: 14

  merge:
    name: Merge and verify the complete four-archive release
    needs: [validate, identity, stage-amd64, stage-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: pixie-release-${{ needs.identity.outputs.source_commit }}-amd64
          path: ${{ runner.temp }}/pixie-release
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: pixie-release-${{ needs.identity.outputs.source_commit }}-arm64
          path: ${{ runner.temp }}/pixie-release
      - name: Merge native archives into the immutable complete release metadata
        run: bun run build:release:merge --output "$RUNNER_TEMP/pixie-release"
      - name: Verify merged four-archive checksum and manifest
        working-directory: ${{ runner.temp }}/pixie-release
        run: |
          set -euo pipefail
          SOURCE_COMMIT='${{ needs.identity.outputs.source_commit }}'
          RELEASE_ID='${{ needs.identity.outputs.release_id }}'
          for product in pixie_web pixie; do
            for architecture in amd64 arm64; do
              test -f "${product}-${RELEASE_ID}-linux-${architecture}.tar.gz"
            done
          done
          sha256sum --check checksums.txt
          jq -e --arg source "$SOURCE_COMMIT" --arg release_id "$RELEASE_ID" \
            '.schemaVersion == 2 and .releaseId == $release_id and .sourceCommit == $source and .cleanSourceTree == true and .completeSet == true and .architectures == ["amd64", "arm64"] and .products == ["pixie_web", "pixie"] and (.artifacts | length == 4) and (.archiveHashes | length == 4) and .checksumsPresent == true' \
            release-manifest.json >/dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pixie-release-${{ needs.identity.outputs.source_commit }}
          path: ${{ runner.temp }}/pixie-release
          if-no-files-found: error
          retention-days: 14

  image:
    name: Validate runnable multi-architecture controller image
    needs: [validate, identity]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build controller image without publication
        run: |
          set -euo pipefail
          SOURCE_COMMIT='${{ needs.identity.outputs.source_commit }}'
          RELEASE_ID='${{ needs.identity.outputs.release_id }}'
          docker buildx build --platform linux/amd64,linux/arm64 --file Dockerfile --target pixie_web \
            --build-arg "VERSION=$RELEASE_ID" \
            --build-arg "REVISION=$SOURCE_COMMIT" \
            --tag "ghcr.io/${GITHUB_REPOSITORY_OWNER}/pixie_web:${RELEASE_ID}" \
            --label "org.opencontainers.image.version=$RELEASE_ID" \
            --label "org.opencontainers.image.revision=$SOURCE_COMMIT" \
            --sbom=true --attest type=provenance --output=type=oci,dest="$RUNNER_TEMP/pixie-controller.oci" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: pixie-image-${{ needs.identity.outputs.source_commit }}
          path: ${{ runner.temp }}/pixie-*
          if-no-files-found: warn
          retention-days: 14

  evidence-arm64:
    name: Produce native arm64 performance and probe evidence
    needs: [validate, identity, merge, image]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.identity.outputs.source_commit }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install evidence dependencies
        run: bun install --frozen-lockfile
      - name: Download staged commit archives
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: pixie-release-${{ needs.identity.outputs.source_commit }}
          path: ${{ runner.temp }}/pixie-release
      - name: Download staged OCI image tar
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: pixie-image-${{ needs.identity.outputs.source_commit }}
          path: ${{ runner.temp }}/pixie-image
      - name: Produce native arm64 performance evidence
        env:
          SOURCE_COMMIT: ${{ needs.identity.outputs.source_commit }}
          RELEASE_ID: ${{ needs.identity.outputs.release_id }}
          ARTIFACT_DIR: ${{ runner.temp }}/pixie-release
          EVIDENCE_DIR: ${{ runner.temp }}/pixie-performance-arm64
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          # The producer resolves the archive matching the host architecture, so
          # this job records native arm64 measurements without emulation. It
          # deliberately runs no gate and no readiness probe.
          bun run scripts/produce-evidence-inputs.ts \
            --artifacts "$ARTIFACT_DIR" \
            --output "$EVIDENCE_DIR" \
            --source-commit "$SOURCE_COMMIT" \
            --release-id "$RELEASE_ID" \
            --reduction-manifest "$GITHUB_WORKSPACE/reductions.json"
      - name: Collect native arm64 probe evidence
        env:
          SOURCE_COMMIT: ${{ needs.identity.outputs.source_commit }}
          RELEASE_ID: ${{ needs.identity.outputs.release_id }}
          ARTIFACT_DIR: ${{ runner.temp }}/pixie-release
          IMAGE_DIR: ${{ runner.temp }}/pixie-image
          EVIDENCE_DIR: ${{ runner.temp }}/pixie-performance-arm64
          PROBE_DIR: ${{ runner.temp }}/pixie-probe-evidence-arm64
        run: |
          set -euo pipefail
          mkdir -p "$PROBE_DIR"
          # Collect a native arm64 bundle and reuse the binaries the producer
          # already extracted. This job runs no live gate; the evidence job
          # merges exactly these BIN-PROBE facts into its single bundle.
          EXTRA_ARGS=()
          BIN_DIR="$EVIDENCE_DIR/binaries"
          for candidate in \
            "$BIN_DIR/products/pixie/pixie"; do
            if [[ -x "$candidate" ]]; then
              EXTRA_ARGS+=(--binary "$candidate")
            fi
          done
          bun run scripts/collect-evidence.ts \
            --artifacts "$ARTIFACT_DIR" \
            --image "$IMAGE_DIR" \
            --source-commit "$SOURCE_COMMIT" \
            --release-id "$RELEASE_ID" \
            --output "$PROBE_DIR/evidence.json" \
            "${EXTRA_ARGS[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pixie-performance-arm64-${{ needs.identity.outputs.source_commit }}
          path: ${{ runner.temp }}/pixie-performance-arm64/performance.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pixie-probe-evidence-arm64-${{ needs.identity.outputs.source_commit }}
          path: ${{ runner.temp }}/pixie-probe-evidence-arm64/evidence.json
          if-no-files-found: error
          retention-days: 14

  evidence:
    name: Run live evidence gates on exact-commit artifacts
    needs: [validate, identity, merge, image, evidence-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.identity.outputs.source_commit }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install evidence dependencies
        run: bun install --frozen-lockfile
      - name: Build the embedded web bundle
        run: bun run build:webui
      - name: Download staged commit archives
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: pixie-release-${{ needs.identity.outputs.source_commit }}
          path: ${{ runner.temp }}/pixie-release
      - name: Download staged OCI image tar
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: pixie-image-${{ needs.identity.outputs.source_commit }}
          path: ${{ runner.temp }}/pixie-image
      - name: Download native arm64 performance evidence
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: pixie-performance-arm64-${{ needs.identity.outputs.source_commit }}
          path: ${{ runner.temp }}/pixie-performance-arm64
      - name: Download native arm64 probe evidence
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: pixie-probe-evidence-arm64-${{ needs.identity.outputs.source_commit }}
          path: ${{ runner.temp }}/pixie-probe-evidence-arm64
      - name: Produce coverage and performance evidence inputs
        env:
          SOURCE_COMMIT: ${{ needs.identity.outputs.source_commit }}
          RELEASE_ID: ${{ needs.identity.outputs.release_id }}
          ARTIFACT_DIR: ${{ runner.temp }}/pixie-release
          EVIDENCE_DIR: ${{ runner.temp }}/pixie-evidence
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          READINESS_URL="${{ vars.PIXIE_READINESS_BASE_URL }}"
          EXTRA_ARGS=()
          if [[ -n "${READINESS_URL:-}" ]]; then
            EXTRA_ARGS+=(--base-url "$READINESS_URL")
          fi
          # The producer extracts the amd64 archives that can actually run on this
          # runner, executes only the checks it can honestly complete, measures
          # fresh-process startup, and merges the committed reductions manifest.
          # arm64 binaries are not emulated here; their probes come from the
          # native arm64 evidence job and are merged below.
          bun run scripts/produce-evidence-inputs.ts \
            --artifacts "$ARTIFACT_DIR" \
            --output "$EVIDENCE_DIR" \
            --source-commit "$SOURCE_COMMIT" \
            --release-id "$RELEASE_ID" \
            --reduction-manifest "$GITHUB_WORKSPACE/reductions.json" \
            "${EXTRA_ARGS[@]}"
      - name: Merge native arm64 performance measurements
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/pixie-evidence
          ARM64_PERFORMANCE_DIR: ${{ runner.temp }}/pixie-performance-arm64
        run: |
          set -euo pipefail
          # The amd64 producer wrote the local performance.json; concatenate the
          # native arm64 measurements so the gate sees both targets. A missing
          # arm64 artifact fails the download step, so this never silently passes.
          bun run scripts/merge-performance.ts \
            --into "$EVIDENCE_DIR/performance.json" \
            --from "$ARM64_PERFORMANCE_DIR/performance.json"
      - name: Collect local evidence bundle from staged artifacts
        env:
          SOURCE_COMMIT: ${{ needs.identity.outputs.source_commit }}
          RELEASE_ID: ${{ needs.identity.outputs.release_id }}
          ARTIFACT_DIR: ${{ runner.temp }}/pixie-release
          IMAGE_DIR: ${{ runner.temp }}/pixie-image
          EVIDENCE_DIR: ${{ runner.temp }}/pixie-evidence
          ARM64_PROBE_DIR: ${{ runner.temp }}/pixie-probe-evidence-arm64
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          # These are deliberately shell-local, not exported: collect-evidence
          # treats an unset COVERAGE_INPUT/PERFORMANCE_INPUT as absent and records
          # a blocked assertion. Exporting an absent path would be read as a
          # provided-but-unreadable input and fail instead of block.
          COVERAGE_FILE="$EVIDENCE_DIR/coverage.json"
          PERFORMANCE_FILE="$EVIDENCE_DIR/performance.json"
          ARM64_PROBE_FILE="$ARM64_PROBE_DIR/evidence.json"
          READINESS_URL="${{ vars.PIXIE_READINESS_BASE_URL }}"
          EXTRA_ARGS=()
          # The native arm64 BIN-PROBE facts are merged into this bundle so both
          # architectures' version/doctor rows are backed by a real execution.
          if [[ -f "$ARM64_PROBE_FILE" ]]; then
            EXTRA_ARGS+=(--probe-evidence "$ARM64_PROBE_FILE")
          fi
          if [[ -f "$COVERAGE_FILE" ]]; then
            EXTRA_ARGS+=(--coverage "$COVERAGE_FILE")
          fi
          if [[ -f "$PERFORMANCE_FILE" ]]; then
            EXTRA_ARGS+=(--performance "$PERFORMANCE_FILE")
          fi
          # The producer extracted the native binaries it actually ran; reuse
          # exactly those paths for the bundled --version/doctor/readiness probes.
          BIN_DIR="$EVIDENCE_DIR/binaries"
          for candidate in \
            "$BIN_DIR/products/pixie/pixie"; do
            if [[ -x "$candidate" ]]; then
              EXTRA_ARGS+=(--binary "$candidate")
            fi
          done
          if [[ -n "${READINESS_URL:-}" ]]; then
            EXTRA_ARGS+=(--base-url "$READINESS_URL")
          fi
          bun run scripts/collect-evidence.ts \
            --artifacts "$ARTIFACT_DIR" \
            --image "$IMAGE_DIR" \
            --source-commit "$SOURCE_COMMIT" \
            --release-id "$RELEASE_ID" \
            --output "$EVIDENCE_DIR/evidence.json" \
            "${EXTRA_ARGS[@]}"
      - name: Run live evidence gates against staged artifacts
        env:
          SOURCE_COMMIT: ${{ needs.identity.outputs.source_commit }}
          RELEASE_ID: ${{ needs.identity.outputs.release_id }}
          ARTIFACT_DIR: ${{ runner.temp }}/pixie-release
          IMAGE_DIR: ${{ runner.temp }}/pixie-image
          EVIDENCE_DIR: ${{ runner.temp }}/pixie-evidence
          EVIDENCE_PATH: ${{ runner.temp }}/pixie-evidence/evidence.json
          # The operator explicitly authorized automatic main publication, and
          # the identity job verified the source commit is reachable from main.
          PIXIE_AUTOMATIC_MAIN_AUTHORIZED: "true"
          PIXIE_SOURCE_REACHABLE_FROM_MAIN: "true"
        run: |
          set -uo pipefail
          mkdir -p "$EVIDENCE_DIR"
          LOG="$EVIDENCE_DIR/decision-log.txt"
          {
            echo "pixie live evidence decision log"
            echo "source_commit=$SOURCE_COMMIT"
            echo "release_id=$RELEASE_ID"
            echo
            echo "staged archive directory ($ARTIFACT_DIR):"
            ls -la "$ARTIFACT_DIR" || true
            echo
            echo "staged OCI image directory ($IMAGE_DIR):"
            ls -la "$IMAGE_DIR" || true
            echo
            echo "staged archive checksums:"
            (cd "$ARTIFACT_DIR" && sha256sum ./*.tar.gz) || true
            echo
            echo "expected exact-commit archives:"
            for product in pixie_web pixie; do
              for architecture in amd64 arm64; do
                archive="${product}-${RELEASE_ID}-linux-${architecture}.tar.gz"
                if [[ -f "$ARTIFACT_DIR/$archive" ]]; then
                  echo "  present: $archive"
                else
                  echo "  MISSING: $archive"
                fi
              done
            done
            echo
          } | tee -a "$LOG"

          GATE_FAILURES=0
          run_gate() {
            local name="$1"
            shift
            echo "=== gate: $name ===" | tee -a "$LOG"
            "$@" 2>&1 | tee -a "$LOG"
            local status="${PIPESTATUS[0]}"
            echo "--- $name exit status: $status ---" | tee -a "$LOG"
            if [[ "$status" -ne 0 ]]; then
              GATE_FAILURES=$((GATE_FAILURES + 1))
            fi
          }

          run_gate "check:coverage" bun run check:coverage -- --evidence "$EVIDENCE_PATH"
          run_gate "check-package-artifacts" bun scripts/check-package-artifacts.ts --evidence "$EVIDENCE_PATH"
          run_gate "check-performance" bun scripts/check-performance.ts --evidence "$EVIDENCE_PATH"
          run_gate "release-gate" bun scripts/release-gate.ts --evidence "$EVIDENCE_PATH"

          {
            echo
            echo "gate failures: $GATE_FAILURES"
            echo "evidence gates are fail-closed; missing or invalid live inputs block publication"
          } | tee -a "$LOG"
          [[ "$GATE_FAILURES" -eq 0 ]]
      - name: Upload live evidence decision log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pixie-evidence-${{ needs.identity.outputs.source_commit }}
          path: ${{ runner.temp }}/pixie-evidence
          if-no-files-found: warn
          retention-days: 14

  publish-image:
    name: Publish exact staged controller image after complete validation
    needs: [validate, identity, merge, image, evidence]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PIXIE_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          # OCI-layout source and referrer copying requires Buildx v0.33.0.
          version: v0.33.0
      - name: Download evidence-gated OCI image artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: pixie-image-${{ needs.identity.outputs.source_commit }}
          path: ${{ runner.temp }}/pixie-image
      - name: Download evidence gate bundle
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: pixie-evidence-${{ needs.identity.outputs.source_commit }}
          path: ${{ runner.temp }}/pixie-evidence
      - name: Log in to GHCR for the authorized release job
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact evidence-gated controller image
        run: |
          set -euo pipefail
          SOURCE_COMMIT='${{ needs.identity.outputs.source_commit }}'
          RELEASE_ID='${{ needs.identity.outputs.release_id }}'
          REF="ghcr.io/${GITHUB_REPOSITORY_OWNER}/pixie_web:${RELEASE_ID}"
          STAGED_IMAGE_ARCHIVE="$RUNNER_TEMP/pixie-image/pixie-controller.oci"
          STAGED_EVIDENCE="$RUNNER_TEMP/pixie-evidence/evidence.json"
          STAGED_OCI_LAYOUT="$RUNNER_TEMP/pixie-controller-layout"
          test -s "$STAGED_IMAGE_ARCHIVE"
          test -s "$STAGED_EVIDENCE"
          mkdir -p "$STAGED_OCI_LAYOUT"
          tar --extract --file "$STAGED_IMAGE_ARCHIVE" --directory "$STAGED_OCI_LAYOUT"
          test -s "$STAGED_OCI_LAYOUT/index.json"

          # Bind the bytes being published to the successful evidence bundle.
          # The collector records the OCI layout's root index digest and the
          # artifact SHA-256; the image descriptor below is selected from that
          # verified layout before it is copied to the registry.
          jq -e --arg source "$SOURCE_COMMIT" --arg release "$RELEASE_ID" '
            .schemaVersion == 1 and .sourceCommit == $source and .releaseId == $release and
            ([.assertions[] | select(.kind == "GATE" and .id == "IMG-CONTROLLER" and .status == "pass")] | length == 1)
          ' "$STAGED_EVIDENCE" >/dev/null
          EVIDENCE_ARCHIVE_NAME=$(jq -er '
            [.assertions[] | select(.kind == "GATE" and .id == "IMG-CONTROLLER" and .status == "pass")] |
            .[0].artifact.name
          ' "$STAGED_EVIDENCE")
          EVIDENCE_ARCHIVE_SHA256=$(jq -er '
            [.assertions[] | select(.kind == "GATE" and .id == "IMG-CONTROLLER" and .status == "pass")] |
            .[0].artifact.sha256
          ' "$STAGED_EVIDENCE")
          EVIDENCE_LAYOUT_DIGEST=$(jq -er '
            [.assertions[] | select(.kind == "GATE" and .id == "IMG-CONTROLLER" and .status == "pass")] |
            .[0].detail | fromjson | .indexDigest
          ' "$STAGED_EVIDENCE")
          [[ "$EVIDENCE_ARCHIVE_NAME" == "$(basename "$STAGED_IMAGE_ARCHIVE")" ]]
          [[ "$EVIDENCE_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EVIDENCE_LAYOUT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$(sha256sum "$STAGED_IMAGE_ARCHIVE" | cut -d' ' -f1)" == "$EVIDENCE_ARCHIVE_SHA256" ]]
          [[ "sha256:$(sha256sum "$STAGED_OCI_LAYOUT/index.json" | cut -d' ' -f1)" == "$EVIDENCE_LAYOUT_DIGEST" ]]

          # BuildKit records the publishable image index as a named descriptor
          # in the OCI layout's root index. Its digest identifies the exact
          # platform manifests and attestation descriptors staged above.
          STAGED_IMAGE_INDEX_DIGEST=$(jq -er --arg ref "$REF" '
            [.manifests[] | select(.annotations["io.containerd.image.name"] == $ref)] |
            if length == 1 then .[0].digest else error("expected one staged controller image descriptor") end
          ' "$STAGED_OCI_LAYOUT/index.json")
          [[ "$STAGED_IMAGE_INDEX_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          STAGED_IMAGE_INDEX="$STAGED_OCI_LAYOUT/blobs/sha256/${STAGED_IMAGE_INDEX_DIGEST#sha256:}"
          test -s "$STAGED_IMAGE_INDEX"
          [[ "sha256:$(sha256sum "$STAGED_IMAGE_INDEX" | cut -d' ' -f1)" == "$STAGED_IMAGE_INDEX_DIGEST" ]]

          # Copy, rather than rebuild, the exact staged OCI image index. Buildx
          # v0.33.0 copies attached referrers, so the staged SBOM and provenance
          # attestations travel with the evidence-gated platform manifests.
          docker buildx imagetools create --tag "$REF" \
            --metadata-file "$RUNNER_TEMP/pixie-image-metadata.json" \
            "oci-layout://$STAGED_OCI_LAYOUT@$STAGED_IMAGE_INDEX_DIGEST"
          test -s "$RUNNER_TEMP/pixie-image-metadata.json"
          INDEX_DIGEST=$(jq -er '."containerimage.descriptor".digest // ."containerimage.digest" // empty' "$RUNNER_TEMP/pixie-image-metadata.json")
          [[ "$INDEX_DIGEST" == "$STAGED_IMAGE_INDEX_DIGEST" ]] || {
            echo "published image index does not match the evidence-gated staged image index" >&2
            exit 1
          }
          # Verify the registry still resolves to the exact staged index. That
          # index binds both runnable platform manifests and their attestations.
          docker buildx imagetools inspect "$REF" | tee "$RUNNER_TEMP/pixie-image-inspect.txt"
          grep -q 'linux/amd64' "$RUNNER_TEMP/pixie-image-inspect.txt"
          grep -q 'linux/arm64' "$RUNNER_TEMP/pixie-image-inspect.txt"
          docker buildx imagetools inspect --raw "$REF" > "$RUNNER_TEMP/pixie-image-index.json"
          PUBLISHED_INDEX_DIGEST="sha256:$(sha256sum "$RUNNER_TEMP/pixie-image-index.json" | cut -d' ' -f1)"
          if [[ "$PUBLISHED_INDEX_DIGEST" != "$STAGED_IMAGE_INDEX_DIGEST" ]]; then
            PUBLISHED_INDEX_DIGEST=$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}')
          fi
          [[ "$PUBLISHED_INDEX_DIGEST" == "$STAGED_IMAGE_INDEX_DIGEST" ]] || {
            echo "registry tag does not resolve to the evidence-gated staged image index" >&2
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/pixie-attestations"
          while read -r ATTESTATION_DIGEST; do
            [[ "$ATTESTATION_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || continue
            docker buildx imagetools inspect --raw "$REF@$ATTESTATION_DIGEST" \
              > "$RUNNER_TEMP/pixie-attestations/${ATTESTATION_DIGEST#sha256:}.json"
          done < <(jq -r '.manifests[]? | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest") | .digest' "$RUNNER_TEMP/pixie-image-index.json")
          SBOM_PRESENT=false
          PROVENANCE_PRESENT=false
          for ATTESTATION in "$RUNNER_TEMP"/pixie-attestations/*.json; do
            [[ -f "$ATTESTATION" ]] || continue
            if jq -e '[.layers[]? | .annotations?["in-toto.io/predicate-type"]? | select(type == "string") | test("spdx|cyclonedx"; "i")] | any' "$ATTESTATION" >/dev/null; then
              SBOM_PRESENT=true
            fi
            if jq -e '[.layers[]? | .annotations?["in-toto.io/predicate-type"]? | select(type == "string") | test("slsa|provenance"; "i")] | any' "$ATTESTATION" >/dev/null; then
              PROVENANCE_PRESENT=true
            fi
          done
          [[ "$SBOM_PRESENT" == true && "$PROVENANCE_PRESENT" == true ]] || {
            echo "published image is missing an SBOM or provenance attestation" >&2
            exit 1
          }
          AMD64_DIGEST=$(jq -r '.manifests[] | select(.platform.architecture == "amd64" and .platform.os == "linux") | .digest' "$RUNNER_TEMP/pixie-image-index.json" | head -n1)
          ARM64_DIGEST=$(jq -r '.manifests[] | select(.platform.architecture == "arm64" and .platform.os == "linux") | .digest' "$RUNNER_TEMP/pixie-image-index.json" | head -n1)
          [[ "$INDEX_DIGEST" =~ ^sha256:[0-9a-f]{64}$ && "$AMD64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ && "$ARM64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
           jq -n --arg tag "$REF" --arg index "$INDEX_DIGEST" --arg amd64 "$AMD64_DIGEST" --arg arm64 "$ARM64_DIGEST" \
            --argjson sbom "$SBOM_PRESENT" --argjson provenance "$PROVENANCE_PRESENT" \
            '{tag: $tag, indexDigest: $index, platformDigests: {amd64: $amd64, arm64: $arm64}, sbom: $sbom, provenance: $provenance}' \
            > "$RUNNER_TEMP/pixie-image-evidence.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pixie-image-evidence-${{ needs.identity.outputs.source_commit }}
          path: ${{ runner.temp }}/pixie-image-evidence.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish immutable GitHub Release
    needs: [validate, identity, merge, image, evidence, publish-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PIXIE_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.identity.outputs.source_commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: pixie-release-${{ needs.identity.outputs.source_commit }}
          path: release
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: pixie-image-evidence-${{ needs.identity.outputs.source_commit }}
          path: image-evidence
      - name: Guard short-ID collisions
        working-directory: release
        run: |
          set -euo pipefail
          SOURCE_COMMIT='${{ needs.identity.outputs.source_commit }}'
          RELEASE_ID='${{ needs.identity.outputs.release_id }}'
          if git ls-remote --exit-code origin "refs/tags/$RELEASE_ID" >/dev/null 2>&1; then
            TARGET=$(git ls-remote origin "refs/tags/$RELEASE_ID" | cut -f1)
            [[ "$TARGET" == "$SOURCE_COMMIT" ]] || { echo 'short-ID collision with a different full commit' >&2; exit 1; }
          fi
      - name: Verify staged payload before publication
        working-directory: release
        run: |
          set -euo pipefail
          sha256sum --check checksums.txt
          RELEASE_ID='${{ needs.identity.outputs.release_id }}'
          for product in pixie_web pixie; do
            for architecture in amd64 arm64; do
              test -f "${product}-${RELEASE_ID}-linux-${architecture}.tar.gz"
            done
          done
          jq -e --arg release_id "$RELEASE_ID" \
            '.schemaVersion == 2 and .releaseId == $release_id and .completeSet == true and .architectures == ["amd64", "arm64"] and .products == ["pixie_web", "pixie"] and (.artifacts | length == 4) and (.archiveHashes | length == 4) and .checksumsPresent == true' \
            release-manifest.json >/dev/null
      - name: Record verified OCI digests in the release manifest
        working-directory: release
        run: |
          set -euo pipefail
          jq -e --arg release_id '${{ needs.identity.outputs.release_id }}' \
            '.tag == ("ghcr.io/" + env.GITHUB_REPOSITORY_OWNER + "/pixie_web:" + $release_id) and (.indexDigest | test("^sha256:[0-9a-f]{64}$")) and (.platformDigests.amd64 | test("^sha256:[0-9a-f]{64}$")) and (.platformDigests.arm64 | test("^sha256:[0-9a-f]{64}$"))' \
            ../image-evidence/pixie-image-evidence.json >/dev/null
          INDEX_DIGEST=$(jq -r '.indexDigest' ../image-evidence/pixie-image-evidence.json)
          AMD64_DIGEST=$(jq -r '.platformDigests.amd64' ../image-evidence/pixie-image-evidence.json)
          ARM64_DIGEST=$(jq -r '.platformDigests.arm64' ../image-evidence/pixie-image-evidence.json)
          jq -e '.sbom == true and .provenance == true' ../image-evidence/pixie-image-evidence.json >/dev/null
          SBOM_PRESENT=$(jq -r '.sbom' ../image-evidence/pixie-image-evidence.json)
          PROVENANCE_PRESENT=$(jq -r '.provenance' ../image-evidence/pixie-image-evidence.json)
          jq --arg index "$INDEX_DIGEST" --arg amd64 "$AMD64_DIGEST" --arg arm64 "$ARM64_DIGEST" \
            --argjson sbom "$SBOM_PRESENT" --argjson provenance "$PROVENANCE_PRESENT" \
            '.completeSet = true | .imageIndexDigest = $index | .platformDigests = {amd64: $amd64, arm64: $arm64} | .sbomPresent = $sbom | .provenancePresent = $provenance' \
            release-manifest.json > release-manifest.next.json
          mv release-manifest.next.json release-manifest.json
      - name: Create or resume the draft release with the complete set
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release
        run: |
          set -euo pipefail
          SOURCE_COMMIT='${{ needs.identity.outputs.source_commit }}'
          RELEASE_ID='${{ needs.identity.outputs.release_id }}'
          # Existing identical payloads are no-ops. A mismatch stops the retry;
          # partial publication is retained and never promotes latest.
          gh release view "$RELEASE_ID" >/dev/null 2>&1 || gh release create "$RELEASE_ID" --draft --title "$RELEASE_ID" --target "$SOURCE_COMMIT"
          TEMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TEMP_DIR"' EXIT
          EXPECTED_ASSETS=(checksums.txt release-manifest.json)
          for product in pixie_web pixie; do
            for architecture in amd64 arm64; do
              EXPECTED_ASSETS+=("${product}-${RELEASE_ID}-linux-${architecture}.tar.gz")
            done
          done
          declare -A EXPECTED_ASSET_SET=()
          for asset in "${EXPECTED_ASSETS[@]}"; do
            EXPECTED_ASSET_SET["$asset"]=1
          done
          # A draft release has no Git tag yet, so the releases/tags endpoint
          # 404s; resolve its numeric ID and read the release directly.
          RELEASE_NUM=$(gh release view "$RELEASE_ID" --json databaseId --jq '.databaseId')
          [[ -n "$RELEASE_NUM" ]] || { echo "release $RELEASE_ID was not found after creation" >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_NUM" > "$TEMP_DIR/release.json"
          while IFS= read -r asset; do
            [[ -n "${EXPECTED_ASSET_SET[$asset]:-}" ]] || {
              echo "release asset $asset is not part of the complete four-archive payload; refusing to publish" >&2
              exit 1
            }
          done < <(jq -r '.assets[]?.name' "$TEMP_DIR/release.json")
          for product in pixie_web pixie; do
            for architecture in amd64 arm64; do
              asset="${product}-${RELEASE_ID}-linux-${architecture}.tar.gz"
              LOCAL_HASH=$(sha256sum "$asset" | cut -d' ' -f1)
              DOWNLOAD_URL=$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .browser_download_url // empty' "$TEMP_DIR/release.json")
              if [[ -z "$DOWNLOAD_URL" ]]; then
                gh release upload "$RELEASE_ID" "$asset"
                continue
              fi
              curl --fail --silent --show-error --location \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/octet-stream' \
                "$DOWNLOAD_URL" -o "$TEMP_DIR/$asset"
              REMOTE_HASH=$(sha256sum "$TEMP_DIR/$asset" | cut -d' ' -f1)
              if [[ "$REMOTE_HASH" != "$LOCAL_HASH" ]]; then
                echo "release asset $asset exists with a different SHA-256; refusing to overwrite" >&2
                exit 1
              fi
              echo "release asset $asset already matches ($LOCAL_HASH); skipping upload"
            done
          done
          for asset in checksums.txt release-manifest.json; do
            LOCAL_HASH=$(sha256sum "$asset" | cut -d' ' -f1)
            DOWNLOAD_URL=$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .browser_download_url // empty' "$TEMP_DIR/release.json")
            if [[ -z "$DOWNLOAD_URL" ]]; then
              gh release upload "$RELEASE_ID" "$asset"
              continue
            fi
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/octet-stream' \
              "$DOWNLOAD_URL" -o "$TEMP_DIR/$asset"
            REMOTE_HASH=$(sha256sum "$TEMP_DIR/$asset" | cut -d' ' -f1)
            if [[ "$REMOTE_HASH" != "$LOCAL_HASH" ]]; then
              echo "release asset $asset exists with a different SHA-256; refusing to overwrite" >&2
              exit 1
            fi
            echo "release asset $asset already matches ($LOCAL_HASH); skipping upload"
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_NUM" > "$TEMP_DIR/release-after-upload.json"
          for asset in "${EXPECTED_ASSETS[@]}"; do
            jq -e --arg name "$asset" '[.assets[] | select(.name == $name and (.size // 0) > 0)] | length == 1' \
              "$TEMP_DIR/release-after-upload.json" >/dev/null || {
              echo "release $RELEASE_ID is missing a non-empty asset $asset after upload" >&2
              exit 1
            }
          done
          [[ "$(jq '[.assets[]?.name] | length' "$TEMP_DIR/release-after-upload.json")" == "${#EXPECTED_ASSETS[@]}" ]] || {
            echo "release $RELEASE_ID contains assets outside the complete four-archive payload" >&2
            exit 1
          }
      - name: Publish the complete release, then consider latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_ID='${{ needs.identity.outputs.release_id }}'
          RELEASE_STATE=$(gh release view "$RELEASE_ID" --json isDraft,isImmutable)
          if jq -e '.isDraft == true' <<<"$RELEASE_STATE" >/dev/null; then
            gh release edit "$RELEASE_ID" --draft=false
          else
            echo "release $RELEASE_ID is already published; keeping its immutable state"
          fi
          # latest promotion is intentionally separate and must compare verified
          # source ancestry; this workflow never moves it backward on a retry.
          echo "immutable release $RELEASE_ID published; latest promotion requires verified ancestry"

  verify-publication:
    name: Verify published tag, release and registry digests
    needs: [identity, merge, evidence, publish-image, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PIXIE_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.identity.outputs.source_commit }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to GHCR to read the published image
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download published image evidence
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: pixie-image-evidence-${{ needs.identity.outputs.source_commit }}
          path: image-evidence
      - name: Verify the published tag, release and registry digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # This job runs strictly after `publish`, so it cannot block the release
          # it verifies. It never rewrites assets: any mismatch fails the job
          # loudly (non-zero exit) and leaves the immutable release untouched.
          SOURCE_COMMIT='${{ needs.identity.outputs.source_commit }}'
          RELEASE_ID='${{ needs.identity.outputs.release_id }}'
          EVIDENCE='image-evidence/pixie-image-evidence.json'
          REF="ghcr.io/${GITHUB_REPOSITORY_OWNER}/pixie_web:${RELEASE_ID}"
          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT

          # 1. The Git tag must exist and point at the exact source commit.
          TAG_COMMIT=$(git ls-remote origin "refs/tags/${RELEASE_ID}" | cut -f1)
          [[ "$TAG_COMMIT" == "$SOURCE_COMMIT" ]] || {
            echo "tag refs/tags/${RELEASE_ID} points at '$TAG_COMMIT', expected $SOURCE_COMMIT" >&2
            exit 1
          }

          # 2. The GitHub Release must be published (not a draft) on that tag.
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_ID}" > "$WORK/release.json"
          jq -e --arg tag "$RELEASE_ID" '.draft == false and .tag_name == $tag' "$WORK/release.json" >/dev/null || {
            echo "release ${RELEASE_ID} is missing, still a draft, or has the wrong tag" >&2
            exit 1
          }

          # 3. Download only the small metadata assets; the four large archives
          # are verified by published digest instead of being re-downloaded.
          gh release download "$RELEASE_ID" --dir "$WORK" \
            --pattern checksums.txt --pattern release-manifest.json
          test -s "$WORK/checksums.txt"
          test -s "$WORK/release-manifest.json"
          jq -e --arg source "$SOURCE_COMMIT" --arg release_id "$RELEASE_ID" \
            '.schemaVersion == 2 and .releaseId == $release_id and .sourceCommit == $source and .completeSet == true and .architectures == ["amd64", "arm64"] and .products == ["pixie_web", "pixie"] and .checksumsPresent == true and .sbomPresent == true and .provenancePresent == true and (.artifacts | length == 4) and (.archiveHashes | length == 4)' \
            "$WORK/release-manifest.json" >/dev/null || {
            echo "published release-manifest.json does not record the complete verified set" >&2
            exit 1
          }

          EXPECTED_ASSETS=(checksums.txt release-manifest.json)
          for product in pixie_web pixie; do
            for architecture in amd64 arm64; do
              EXPECTED_ASSETS+=("${product}-${RELEASE_ID}-linux-${architecture}.tar.gz")
            done
          done
          for asset in "${EXPECTED_ASSETS[@]}"; do
            jq -e --arg name "$asset" '[.assets[] | select(.name == $name and (.size // 0) > 0)] | length == 1' "$WORK/release.json" >/dev/null || {
              echo "release ${RELEASE_ID} is missing a non-empty asset ${asset}" >&2
              exit 1
            }
          done
          [[ "$(jq '[.assets[]?.name] | length' "$WORK/release.json")" == "${#EXPECTED_ASSETS[@]}" ]] || {
            echo "release ${RELEASE_ID} contains assets outside the complete four-archive payload" >&2
            exit 1
          }

          # Every archive's published digest must match the hash staging recorded.
          while IFS= read -r asset; do
            RECORDED=$(jq -r --arg name "$asset" '.archiveHashes[$name] // empty' "$WORK/release-manifest.json")
            PUBLISHED=$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .digest // empty' "$WORK/release.json")
            [[ -n "$RECORDED" && "$PUBLISHED" == "sha256:${RECORDED}" ]] || {
              echo "asset ${asset} digest '${PUBLISHED}' does not match recorded sha256:${RECORDED}" >&2
              exit 1
            }
          done < <(jq -r '.archiveHashes | keys[]' "$WORK/release-manifest.json")

          # checksums.txt must list exactly the recorded archive hashes, and the
          # downloaded metadata assets must match their published digests.
          RECORDED_CHECKSUMS=$(jq -r '.archiveHashes | to_entries[] | "\(.value)  \(.key)"' "$WORK/release-manifest.json" | sort)
          PUBLISHED_CHECKSUMS=$(sort "$WORK/checksums.txt")
          [[ "$RECORDED_CHECKSUMS" == "$PUBLISHED_CHECKSUMS" ]] || {
            echo "published checksums.txt disagrees with release-manifest archiveHashes" >&2
            exit 1
          }
          for local in checksums.txt release-manifest.json; do
            ACTUAL="sha256:$(sha256sum "$WORK/${local}" | cut -d' ' -f1)"
            PUBLISHED=$(jq -r --arg name "$local" '.assets[] | select(.name == $name) | .digest // empty' "$WORK/release.json")
            [[ "$PUBLISHED" == "$ACTUAL" ]] || {
              echo "asset ${local} digest '${PUBLISHED}' does not match downloaded content '${ACTUAL}'" >&2
              exit 1
            }
          done

          # 4. The published multi-architecture index and both platform digests
          # must match the evidence the publish job verified before upload.
          EVIDENCE_INDEX=$(jq -r '.indexDigest' "$EVIDENCE")
          EVIDENCE_AMD64=$(jq -r '.platformDigests.amd64' "$EVIDENCE")
          EVIDENCE_ARM64=$(jq -r '.platformDigests.arm64' "$EVIDENCE")
          docker buildx imagetools inspect --raw "$REF" > "$WORK/published-index.json"
          PUBLISHED_INDEX="sha256:$(sha256sum "$WORK/published-index.json" | cut -d' ' -f1)"
          if [[ "$PUBLISHED_INDEX" != "$EVIDENCE_INDEX" ]]; then
            # --raw should be the registry's exact manifest bytes. If a buildx
            # build terminates the stream with a newline, fall back to the
            # registry-reported descriptor digest before failing.
            PUBLISHED_INDEX=$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}')
          fi
          PUBLISHED_AMD64=$(jq -r '.manifests[] | select(.platform.architecture == "amd64" and .platform.os == "linux") | .digest' "$WORK/published-index.json" | head -n1)
          PUBLISHED_ARM64=$(jq -r '.manifests[] | select(.platform.architecture == "arm64" and .platform.os == "linux") | .digest' "$WORK/published-index.json" | head -n1)
          [[ "$PUBLISHED_INDEX" == "$EVIDENCE_INDEX" && "$PUBLISHED_AMD64" == "$EVIDENCE_AMD64" && "$PUBLISHED_ARM64" == "$EVIDENCE_ARM64" ]] || {
            echo "published image digests disagree with pixie-image-evidence.json" >&2
            echo "  index published=$PUBLISHED_INDEX evidence=$EVIDENCE_INDEX" >&2
            echo "  amd64 published=$PUBLISHED_AMD64 evidence=$EVIDENCE_AMD64" >&2
            echo "  arm64 published=$PUBLISHED_ARM64 evidence=$EVIDENCE_ARM64" >&2
            exit 1
          }

          # 5. The published tag must carry the SBOM and provenance attestation
          # manifests; this reuses the predicate inspection from publish-image.
          mkdir -p "$WORK/attestations"
          while read -r ATTESTATION_DIGEST; do
            [[ "$ATTESTATION_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || continue
            docker buildx imagetools inspect --raw "$REF@$ATTESTATION_DIGEST" \
              > "$WORK/attestations/${ATTESTATION_DIGEST#sha256:}.json"
          done < <(jq -r '.manifests[]? | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest") | .digest' "$WORK/published-index.json")
          SBOM_PRESENT=false
          PROVENANCE_PRESENT=false
          for ATTESTATION in "$WORK"/attestations/*.json; do
            [[ -f "$ATTESTATION" ]] || continue
            if jq -e '[.layers[]? | .annotations?["in-toto.io/predicate-type"]? | select(type == "string") | test("spdx|cyclonedx"; "i")] | any' "$ATTESTATION" >/dev/null; then
              SBOM_PRESENT=true
            fi
            if jq -e '[.layers[]? | .annotations?["in-toto.io/predicate-type"]? | select(type == "string") | test("slsa|provenance"; "i")] | any' "$ATTESTATION" >/dev/null; then
              PROVENANCE_PRESENT=true
            fi
          done
          [[ "$SBOM_PRESENT" == true && "$PROVENANCE_PRESENT" == true ]] || {
            echo "published image is missing an SBOM or provenance attestation" >&2
            exit 1
          }

          echo 'verify-publication passed'
          echo "  tag:          refs/tags/${RELEASE_ID} -> ${SOURCE_COMMIT}"
          echo "  release:      ${RELEASE_ID} (published, 10 assets verified)"
          echo "  image:        ${REF}"
          echo "  index digest: ${PUBLISHED_INDEX}"
          echo "  platforms:    linux/amd64 ${PUBLISHED_AMD64} linux/arm64 ${PUBLISHED_ARM64}"
          echo "  attestations: sbom=${SBOM_PRESENT} provenance=${PROVENANCE_PRESENT}"
