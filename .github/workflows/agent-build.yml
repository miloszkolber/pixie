name: Build the pi binary

on:
  push:
    branches: [main]
    tags: ["agent-v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: agent-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build and smoke-test (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [bun-linux-x64, bun-linux-arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # build:agent produces the pinned extension tree and the host binary;
      # the per-target binary is cross-compiled right after.
      - run: bun run build:agent
      - run: bun build ./agent/main.ts --compile --target ${{ matrix.target }} --outfile agent/dist/pi-${{ matrix.target }}
      - name: Smoke-test the binary with the built extension tree
        if: matrix.target == 'bun-linux-x64'
        run: |
          ./agent/dist/pi-bun-linux-x64 --version
          agent_dir=$(mktemp -d)
          lib="$GITHUB_WORKSPACE/agent/dist/extensions/node_modules"
          mkdir -p "$agent_dir"
          cat > "$agent_dir/settings.json" <<EOF
          { "extensions": [
            "$lib/@mjakl/pi-subagent",
            "$lib/@juicesharp/rpiv-todo",
            "$lib/@juicesharp/rpiv-web-tools",
            "$lib/@juicesharp/rpiv-ask-user-question",
            "$lib/pi-mcp-adapter"
          ] }
          EOF
          PI_CODING_AGENT_DIR="$agent_dir" PIXIE_PI_SECRET_KEY="ci-agent-smoke-16" \
            ./agent/dist/pi-bun-linux-x64 --agent-dir "$agent_dir" --port 33991 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -sf -H "Authorization: Bearer ci-agent-smoke-16" \
              http://127.0.0.1:33991/readyz | grep -q '"mcp":1'; then
              echo "binary host ready with the native MCP runtime"
              exit 0
            fi
            sleep 1
          done
          echo "binary host did not become ready with the extension tree" >&2
          exit 1
      - name: Attach release artifacts
        if: startsWith(github.ref, 'refs/tags/agent-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=("agent/dist/pi-${{ matrix.target }}")
          if [ "${{ matrix.target }}" = "bun-linux-x64" ]; then
            tar -czf pi-extensions.tar.gz -C agent/dist extensions
            files+=("pi-extensions.tar.gz")
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber 2>/dev/null ||
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "$GITHUB_REF_NAME" --notes "Standalone pi binary per target and the pinned extension tree (linux-x64)."
