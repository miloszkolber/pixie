name: Container image validation

# Commit release owns publication. This workflow retains inexpensive
# validate-only coverage for pull requests and scheduled dependency checks.
on:
  schedule:
    - cron: "37 4 * * 0"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "docker-compose.yaml"
      - ".dockerignore"
      - "LICENSE"
      - "NOTICE.md"
      - ".pixie.example"
      - "package/**"
      - "patches/**"
      - "assistant/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "biome.json"

concurrency:
  group: container-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Source validation
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ github.sha }}
    permissions:
      contents: read

  image:
    name: Build controller image without publication
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-qemu-action@1f40c72289eff860eea304f1438e3cff362a0 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0 # v4
      - name: Build both runnable OCI platforms in validate-only mode
        run: |
          set -euo pipefail
          SOURCE_COMMIT=$(git rev-parse --verify 'HEAD^{commit}')
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'SOURCE_COMMIT must be 40 lowercase hexadecimal characters' >&2
            exit 1
          fi
          RELEASE_ID="sha-${SOURCE_COMMIT:0:12}"
          docker buildx build --platform linux/amd64,linux/arm64 --file package/Dockerfile --target pixie \
            --build-arg "VERSION=${RELEASE_ID}" \
            --build-arg "REVISION=${SOURCE_COMMIT}" \
            --tag "pixie:${RELEASE_ID}" \
            --label "org.opencontainers.image.version=${RELEASE_ID}" \
            --label "org.opencontainers.image.revision=${SOURCE_COMMIT}" \
            --sbom=true --attest type=provenance --output=type=oci,dest="$RUNNER_TEMP/pixie-controller.oci" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: pixie-controller-validation
          path: ${{ runner.temp }}/pixie-controller.oci
          if-no-files-found: warn
          retention-days: 7
