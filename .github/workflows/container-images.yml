name: Container images

on:
  schedule:
    - cron: "37 4 * * 0"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "README.md"
      - "docs/**"
      - "docker-compose.yaml"
      - ".dockerignore"
      - "LICENSE"
      - "NOTICE.md"
      - ".pixie.example"
      - "pixie/**"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/**"
      - "README.md"
      - "docs/**"
      - "docker-compose.yaml"
      - ".dockerignore"
      - "LICENSE"
      - "NOTICE.md"
      - ".pixie.example"
      - "pixie/**"

concurrency:
  group: container-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Source validation
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ github.sha }}
    permissions:
      contents: read

  build:
    name: Build ${{ matrix.target }} image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: pixie
            image: pixie
          - target: mcp
            image: pixie-mcp
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Record exact source revision
        id: source
        run: |
          echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.version=${{ steps.source.outputs.version }}
          tags: |
            type=ref,event=tag
            type=raw,value=sha-${{ steps.source.outputs.short }}

      - name: Build container image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./pixie/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.source.outputs.version }}
            REVISION=${{ steps.source.outputs.revision }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          no-cache-filters: ${{ github.event_name == 'schedule' && 'git-runtime-trim,browser-packages,pixie' || '' }}

      - name: Record immutable image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          REVISION: ${{ steps.source.outputs.revision }}
        run: |
          jq -n --arg image "$IMAGE" --arg digest "$DIGEST" --arg revision "$REVISION" \
            '{image: $image, digest: $digest, revision: $revision}' > image.json

      - name: Upload image identity
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deployment-${{ matrix.image }}
          path: image.json

  deployment:
    name: Publish coordinated deployment
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble and validate deployment manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REVISION: ${{ github.sha }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name deployment-pixie --name deployment-pixie-mcp --dir image-identities
          jq -s --arg revision "$REVISION" --arg owner "$OWNER" '
            if length != 2 or any(.[]; .revision != $revision or (.digest | test("^sha256:[a-f0-9]{64}$") | not))
              or ([.[].image] | sort) != (["ghcr.io/" + $owner + "/pixie", "ghcr.io/" + $owner + "/pixie-mcp"] | sort)
            then error("Images do not form one deployment revision")
            else {schemaVersion: 1, revision: $revision, images: map({image, digest, reference: (.image + "@" + .digest)})} end
          ' image-identities/*/image.json > deployment.json
      - name: Publish deployment manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deployment-manifest
          path: deployment.json
      - name: Promote current default-branch deployment
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          current=$(git ls-remote origin "refs/heads/$DEFAULT_BRANCH" | cut -f1)
          if [ "$current" = "$(git rev-parse HEAD)" ]; then
            jq -r '.images[] | [.image, .reference] | @tsv' deployment.json | while read -r image reference; do
              docker buildx imagetools create --tag "$image:latest" "$reference"
            done
          else
            echo 'Default branch advanced; immutable deployment retained without changing latest.' >> "$GITHUB_STEP_SUMMARY"
          fi
