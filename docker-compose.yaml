services:
    pixie:
        image: "${PIXIE_IMAGE:-ghcr.io/miloszkolber/pixie:latest}"
        container_name: pixie
        restart: unless-stopped
        network_mode: host
        user: "1000:1000"
        read_only: true
        env_file:
            - path: .pixie
              required: false
        environment:
            PIXIE_PI_PORT: "${PIXIE_PI_PORT:-}"
            PIXIE_PI_URL: "${PIXIE_PI_URL:-}"
            PIXIE_PI_SECRET_KEY: "${PIXIE_PI_SECRET_KEY:?set the Pi service secret in .pixie}"
            PIXIE_AUTH_ENABLED: "${PIXIE_AUTH_ENABLED:-false}"
            PIXIE_TOKEN: "${PIXIE_TOKEN:-}"
            PIXIE_CONTROLLER_HOST: "${PIXIE_CONTROLLER_HOST:-127.0.0.1}"
            PIXIE_ALLOW_UNAUTHENTICATED_REMOTE: "${PIXIE_ALLOW_UNAUTHENTICATED_REMOTE:-false}"
            PIXIE_PUBLIC_ORIGIN: "${PIXIE_PUBLIC_ORIGIN:-}"
            PIXIE_TRUSTED_PROXY_CIDRS: "${PIXIE_TRUSTED_PROXY_CIDRS:-}"
            # The in-process MCP publisher and Pi adapter registration share this token.
            PIXIE_MCP_TOKEN: "${PIXIE_MCP_TOKEN:?set a strong MCP token in .pixie}"
            # Pinned to the container layout below; non-Docker runs leave
            # PIXIE_DATA_DIR unset for the XDG default (see docs/deployment.md).
            PIXIE_DATA_DIR: "/var/lib/pixie"
        volumes:
            - ${PIXIE_DATA_PATH}:/var/lib/pixie
            # Add each admitted project root here as a read-only bind at the same absolute path.
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        pids_limit: 512
        mem_limit: 2g
        cpus: 2.0
        tmpfs:
            - /tmp:size=128m,mode=1777,uid=1000,gid=1000
            - /run:size=16m,mode=700,uid=1000,gid=1000
            - /dev/shm:size=256m,mode=1777,uid=1000,gid=1000

    # External browser MCP endpoint. Pi connects to it directly at the
    # published host-loopback port; Pixie stores and registers the setting but
    # never starts, proxies or hardens this service. Optional: `pixie` does not
    # depend on it, and `docker compose up pixie` never starts it. The image
    # binds its MCP HTTP transport with no authentication, so it publishes only
    # on 127.0.0.1 and joins its own network, isolated from the controller.
    pixie-browser:
        image: "h4ckf0r0day/obscura:latest"
        container_name: pixie-browser
        restart: unless-stopped
        command: ["mcp", "--http", "--host", "0.0.0.0", "--port", "3000"]
        user: "65532:65532"
        read_only: true
        networks:
            - pixie-browser
        ports:
            - "127.0.0.1:3000:3000"
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        pids_limit: 256
        mem_limit: 2g
        cpus: 1.0
        tmpfs:
            - /tmp:size=256m,mode=1777,uid=65532,gid=65532

networks:
    pixie-browser:
        driver: bridge
